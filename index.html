<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסיבת חנוכה לנוער</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: festive night out for teens, warm and energetic, never loud-cheap
   IDEA: a menorah lighting up in the dark — entering the page lights the candles
   PICTURE: large drawn menorah with flickering flames and floating sparks
   COLOUR and TYPE: deep night indigo, candle gold, one electric cyan; Secular One + Rubik
   LAYOUT: one column: gate screen → menorah hero → details → form → WhatsApp confirm */
:root{color-scheme:dark;--bg:#0b0a2a;--bg2:#15124a;--ink:#f4f1ff;--mute:#b9b4e0;--gold:#ffc547;--flame:#ff8a1f;--cyan:#3ef0ff;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#2a1f7a 0%,var(--bg2) 35%,var(--bg) 75%) fixed,var(--bg);color:var(--ink);font:17px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3{font-family:"Secular One",Rubik,sans-serif;font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:12px}

/* sparks background */
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* gate */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(70% 50% at 50% 45%,#231b6b,#07061c 80%);transition:opacity .7s,visibility .7s}
#gate.gone{opacity:0;visibility:hidden}
#gate p{color:var(--mute);margin:.6em 0 1.6em}
#gate h2{font-size:clamp(30px,8vw,48px);color:var(--gold);text-shadow:0 0 24px rgba(255,197,71,.55)}
.enter{position:relative;border:0;cursor:pointer;padding:18px 38px;border-radius:999px;font-family:"Secular One";font-size:22px;color:#1a1033;background:linear-gradient(180deg,#ffe08a,var(--gold));box-shadow:0 0 0 6px rgba(255,197,71,.15),0 0 40px rgba(255,197,71,.55);min-height:56px}
.enter:active{transform:scale(.97)}
.ring{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:rgba(255,197,71,.1);box-shadow:0 0 50px rgba(255,197,71,.35)}

/* sound toggle */
#snd{position:fixed;top:14px;left:14px;z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(11,10,42,.7);backdrop-filter:blur(6px);cursor:pointer;display:grid;place-items:center}
#snd svg{width:22px;height:22px}
.bsd{position:fixed;top:16px;right:18px;z-index:40;font-size:13px;color:var(--mute)}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:64px 18px 48px}

/* hero */
.hero{text-align:center}
.org{color:var(--cyan);font-weight:500;font-size:15px;letter-spacing:.02em;text-shadow:0 0 14px rgba(62,240,255,.5)}
.hero h1{font-size:clamp(44px,13vw,76px);margin:.15em 0 .1em;color:#fff;text-shadow:0 0 18px rgba(255,197,71,.7),0 0 46px rgba(255,138,31,.45)}
.hero .sub{color:var(--mute);font-size:18px;margin:0}
.meno{width:100%;max-width:470px;margin:18px auto 0;display:block;overflow:visible}
.flame{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .4s}
.flame.on{opacity:1;animation:flick 1.6s ease-in-out infinite alternate}
.glow{opacity:0;transition:opacity .6s}.glow.on{opacity:1}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(.94,1.06) skewX(2deg)}60%{transform:scale(1.04,.95) skewX(-2deg)}100%{transform:scale(.97,1.04) skewX(1deg)}}

/* details */
.when{margin:26px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.when div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.when b{display:block;font-family:"Secular One";font-size:clamp(17px,4.6vw,22px);color:var(--gold);white-space:nowrap}
.when span{font-size:14px;color:var(--mute)}
.count{display:flex;justify-content:center;gap:10px;margin:22px 0 4px;direction:ltr}
.count div{width:70px;padding:10px 0;border-radius:16px;background:rgba(62,240,255,.07);border:1px solid rgba(62,240,255,.35);text-align:center}
.count b{display:block;font-family:"Secular One";font-size:28px;color:var(--cyan);line-height:1.1}
.count span{font-size:13px;color:var(--mute)}
.cdl{text-align:center;color:var(--mute);font-size:14px}
.hl{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px}
.hl li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:linear-gradient(90deg,rgba(255,197,71,.1),rgba(255,255,255,.03));border:1px solid var(--line)}
.hl svg{flex:none;width:34px;height:34px}
.cta{display:block;width:100%;margin-top:26px;text-align:center;text-decoration:none;padding:18px;border-radius:999px;font-family:"Secular One";font-size:22px;color:#08223a;background:linear-gradient(180deg,#9ff8ff,var(--cyan));box-shadow:0 0 34px rgba(62,240,255,.5)}

/* form */
.card{margin-top:44px;padding:26px 20px;border-radius:26px;background:rgba(10,9,38,.78);border:1px solid rgba(62,240,255,.3);box-shadow:0 0 50px rgba(62,240,255,.12);backdrop-filter:blur(8px)}
.card h2{font-size:clamp(30px,8vw,40px);color:var(--cyan);text-shadow:0 0 18px rgba(62,240,255,.5)}
.card>p{color:var(--mute);margin:.4em 0 1.2em}
.f{margin-bottom:16px}
.f label{display:block;font-weight:500;margin-bottom:6px}
.f label small{color:var(--mute);font-weight:400}
.f input,.f select,.f textarea{width:100%;min-height:52px;padding:12px 16px;font-size:16px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.35);outline:none;transition:border-color .2s,box-shadow .2s}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(62,240,255,.2)}
.f .err{display:none;color:#ff9bb3;font-size:14px;margin-top:5px}
.f.bad input,.f.bad select{border-color:#ff6b8f}.f.bad .err{display:block}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:24px;cursor:pointer}
.step output{min-width:2ch;text-align:center;font-family:"Secular One";font-size:24px;color:var(--gold)}
.go{width:100%;min-height:58px;border:0;border-radius:999px;cursor:pointer;font-family:"Secular One";font-size:22px;color:#1a1033;background:linear-gradient(180deg,#ffe08a,var(--gold));box-shadow:0 0 34px rgba(255,197,71,.5);margin-top:6px}
.go:active{transform:scale(.98)}

/* done */
#done{display:none;text-align:center}
#done.show{display:block;animation:pop .5s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#done h2{color:var(--gold);text-shadow:0 0 20px rgba(255,197,71,.6)}
.wa{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0 10px;padding:17px;border-radius:999px;text-decoration:none;font-family:"Secular One";font-size:21px;color:#fff;background:#1fae5b;box-shadow:0 0 30px rgba(37,211,102,.45)}
.wa svg{width:26px;height:26px}
.sum{text-align:start;margin:16px 0 0;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:15px;white-space:pre-line}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 10px}
footer{position:relative;z-index:1;text-align:center;color:var(--mute);font-size:14px;padding:10px 18px 40px}
footer a{color:var(--cyan)}
@media(prefers-reduced-motion:reduce){.flame.on{animation:none}#done.show{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="sparks" aria-hidden="true"></canvas>

<div id="gate">
  <div>
    <div class="ring"><svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><path d="M20 4c5 7 9 11 9 18a9 9 0 0 1-18 0c0-5 3-8 5-11 1 3 2 5 4 6 0-5 0-9 0-13z" fill="#ffc547"/></svg></div>
    <h2>חנוכה שמח!</h2>
    <p>מוכנים להדליק את המסיבה?</p>
    <button class="enter" id="enterBtn" type="button">לחצו ונכנסים ✦</button>
  </div>
</div>

<button id="snd" type="button" aria-label="השתקת מוזיקה" aria-pressed="false"></button>
<div class="bsd">בס״ד</div>

<main>
  <section class="hero">
    <div class="org" id="org"></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>

    <svg class="meno" id="meno" viewBox="0 0 460 300" aria-label="חנוכייה דולקת" role="img">
      <defs>
        <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe7a1"/><stop offset=".5" stop-color="#e9a92c"/><stop offset="1" stop-color="#9c6510"/></linearGradient>
        <linearGradient id="fl" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#ff5a1f"/><stop offset=".5" stop-color="#ffb02e"/><stop offset="1" stop-color="#fff6c8"/></linearGradient>
        <radialGradient id="halo"><stop offset="0" stop-color="#ffc547" stop-opacity=".55"/><stop offset="1" stop-color="#ffc547" stop-opacity="0"/></radialGradient>
      </defs>
      <g id="arms" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"></g>
      <rect x="224" y="110" width="12" height="150" rx="5" fill="url(#gold)"/>
      <path d="M180 262h100l14 22H166z" fill="url(#gold)"/>
      <ellipse cx="230" cy="290" rx="92" ry="7" fill="#000" opacity=".35"/>
      <g id="cups"></g>
      <g id="flames"></g>
    </svg>

    <div class="when" id="when"></div>
    <div class="count" id="count" aria-live="off"></div>
    <div class="cdl" id="cdl"></div>

    <ul class="hl" id="hl"></ul>
    <a class="cta" href="#reg">להרשמה ←</a>
  </section>

  <section class="card" id="reg" aria-labelledby="regT">
    <form id="form" novalidate>
      <h2 id="regT">שומרים לך מקום</h2>
      <p>ממלאים כמה פרטים ושולחים — זה לוקח חצי דקה.</p>
      <div class="f" id="f-name"><label for="name">שם מלא</label><input id="name" autocomplete="name" placeholder="איך קוראים לך?"><div class="err">רק השם, ואפשר להמשיך</div></div>
      <div class="row">
        <div class="f" id="f-phone"><label for="phone">טלפון</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05X-XXXXXXX" dir="ltr"><div class="err">מספר נייד לא תקין</div></div>
        <div class="f" id="f-age"><label for="age">גיל</label><select id="age"><option value="">בחירה</option></select><div class="err">בחרו גיל</div></div>
      </div>
      <div class="f" id="f-parent"><label for="parent">טלפון של הורה <small>(לא חובה)</small></label><input id="parent" type="tel" inputmode="tel" placeholder="05X-XXXXXXX" dir="ltr"><div class="err">מספר נייד לא תקין</div></div>
      <div class="f"><label id="frL">מביאים עוד חברים?</label>
        <div class="step" role="group" aria-labelledby="frL"><button type="button" id="minus" aria-label="פחות">−</button><output id="friends">0</output><button type="button" id="plus" aria-label="יותר">+</button></div></div>
      <div class="f"><label for="note">משהו שחשוב שנדע? <small>(לא חובה)</small></label><textarea id="note" placeholder="שאלה, בקשה, רעיון…"></textarea></div>
      <button class="go" type="submit">אני בפנים!</button>
      <p id="err" role="alert" style="color:#ff9bb3;text-align:center;margin:10px 0 0"></p>
    </form>

    <div id="done" aria-live="polite">
      <h2>נרשמת! נתראה במסיבה ✦</h2>
      <p>ההרשמה נקלטה אצלנו. שמרנו לך מקום ליד החנוכייה.</p>
      <div class="sum" id="sum"></div>
      <button class="link" type="button" id="edit">רישום של מישהו נוסף</button>
    </div>
  </section>
</main>

<footer id="foot"></footer>

<script>
{
// ===== פרטי האירוע — לעריכה =====
const EV = {
  org: "חב״ד לנוער · נאות פרס",
  title: "מסיבת חנוכה",
  sub: "ערב של אור, מוזיקה וחברים",
  start: "2026-12-10T19:30:00+02:00",
  when: [["נר שביעי","של חנוכה"],["יום חמישי","10.12"],["19:30","פתיחת דלתות"]],
  place: "מרכז תרבות לנוער ״היציע״ · אצטדיון סמי עופר",
  highlights: [
    ["fire", "הדלקת נר שביעי", "כולם יחד, עם שירה"],
    ["music", "מוזיקה ושמחה", "ריקודים ואווירה של חג"],
    ["gift", "הפתעות ופרסים", "לכל מי שמגיע"]
  ],
  sheetUrl: "https://script.google.com/macros/s/AKfycbx17Ix9ZboOHjG01eIVjI1frgZ8Yg_r0dLn7_uC_uxtdj5A1HKiJIs2azrBl1SPFuyv/exec", // כתובת ה-Web App של Apps Script
  whatsapp: "972584207543",
  contactName: "הרב שלומי קופצ׳יק", contactPhone: "058-4207543",
  ages: [11, 18]
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("org").textContent = EV.org; $("title").textContent = EV.title; $("sub").textContent = EV.sub;
document.title = EV.title + " | " + EV.org;
$("when").innerHTML = EV.when
  .map(([b,s]) => `<div><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
const icons = {
  fire:'<svg viewBox="0 0 34 34"><path d="M17 3c4 6 9 10 9 17a9 9 0 0 1-18 0c0-4 2-7 4-9 1 2 2 4 4 5 0-5 0-9 1-13z" fill="#ffc547"/></svg>',
  music:'<svg viewBox="0 0 34 34"><path d="M12 25V8l15-3v16" fill="none" stroke="#3ef0ff" stroke-width="2.5"/><circle cx="9" cy="25" r="4" fill="#3ef0ff"/><circle cx="24" cy="21" r="4" fill="#3ef0ff"/></svg>',
  gift:'<svg viewBox="0 0 34 34"><rect x="5" y="13" width="24" height="16" rx="3" fill="#ff8a1f"/><rect x="3" y="9" width="28" height="6" rx="2" fill="#ffc547"/><path d="M17 9v20" stroke="#0b0a2a" stroke-width="3"/><path d="M17 9c-3-6-9-5-8-1s8 1 8 1zm0 0c3-6 9-5 8-1s-8 1-8 1z" fill="#ffc547"/></svg>'
};
$("hl").innerHTML = EV.highlights.map(([i,t,d]) => `<li>${icons[i]||""}<div><b>${esc(t)}</b><br><span style="color:var(--mute);font-size:15px">${esc(d)}</span></div></li>`).join("")
  + `<li><svg viewBox="0 0 34 34"><path d="M17 3a10 10 0 0 0-10 10c0 8 10 18 10 18s10-10 10-18A10 10 0 0 0 17 3z" fill="#3ef0ff"/><circle cx="17" cy="13" r="4" fill="#0b0a2a"/></svg><div><b>${esc(EV.place)}</b></div></li>`;
$("foot").innerHTML = `שאלות? ${esc(EV.contactName)} · <a href="https://wa.me/${esc(EV.whatsapp)}" target="_blank" rel="noopener" dir="ltr">${esc(EV.contactPhone)}</a>`;
const ageSel = $("age");
for (let a = EV.ages[0]; a <= EV.ages[1]; a++) ageSel.insertAdjacentHTML("beforeend", `<option value="${a}">${a}</option>`);

// ===== menorah =====
const xs = [50,95,140,185,230,275,320,365,410];
const arms = xs.filter(x => x !== 230).map(x => { const d = Math.abs(230 - x); return `<path d="M${x} 120 Q${x} ${120 + d * .75} 230 ${120 + d * .75 + 10}"/>`; });
$("arms").innerHTML = arms.join("");
$("cups").innerHTML = xs.map(x => { const y = x === 230 ? 82 : 112; return `<rect x="${x-11}" y="${y}" width="22" height="10" rx="3" fill="url(#gold)"/><rect x="${x-5}" y="${y-20}" width="10" height="20" rx="2" fill="#f2ecff" opacity=".9"/>`; }).join("");
$("flames").innerHTML = xs.map((x, i) => { const y = x === 230 ? 62 : 92; return `<circle class="glow" data-i="${i}" cx="${x}" cy="${y-8}" r="30" fill="url(#halo)"/><path class="flame" data-i="${i}" style="animation-delay:${(i*.17)%1}s" d="M${x} ${y-30} C${x+9} ${y-16} ${x+8} ${y-4} ${x} ${y} C${x-8} ${y-4} ${x-9} ${y-16} ${x} ${y-30}Z" fill="url(#fl)"/>`; }).join("");
function lightMenorah() {
  const order = [4,8,7,6,5,3,2,1,0];
  order.forEach((i, k) => setTimeout(() => document.querySelectorAll(`[data-i="${i}"]`).forEach(el => el.classList.add("on")), 300 + k * 260));
}

// ===== countdown =====
const target = new Date(EV.start).getTime();
function tick() {
  let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
  if (s === 0) { $("count").innerHTML = ""; $("cdl").textContent = Date.now() > target + 4 * 3600e3 ? "האירוע הסתיים — תודה שהייתם איתנו!" : "המסיבה כבר התחילה!"; return; }
  const parts = [[Math.floor(s / 86400), "ימים"], [Math.floor(s % 86400 / 3600), "שעות"], [Math.floor(s % 3600 / 60), "דקות"], [s % 60, "שניות"]];
  $("count").innerHTML = parts.map(([n, l]) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l}</span></div>`).join("");
  $("cdl").textContent = "עד שמדליקים";
}
tick(); setInterval(tick, 1000);

// ===== sparks =====
const cv = $("sparks"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, P = [];
function size() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
for (let i = 0; i < 46; i++) P.push({x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + .4, v: Math.random() * .0012 + .0004, c: Math.random() < .7 ? "255,197,71" : "62,240,255", p: Math.random() * 6});
function draw(t) {
  cx.clearRect(0, 0, W, H);
  for (const s of P) {
    if (!reduce) { s.y -= s.v; if (s.y < -.02) { s.y = 1.02; s.x = Math.random(); } }
    const a = .35 + .35 * Math.sin(t / 600 + s.p);
    cx.beginPath(); cx.arc(s.x * W, s.y * H, s.r * devicePixelRatio, 0, 7);
    cx.fillStyle = `rgba(${s.c},${a})`; cx.shadowBlur = 8 * devicePixelRatio; cx.shadowColor = `rgba(${s.c},.9)`; cx.fill();
  }
  if (!reduce) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ===== music (original synth loop, Web Audio) =====
let ac = null, master = null, playing = false, loopT = null, nextBar = 0, bar = 0;
const BPM = 112, beat = 60 / BPM;
const chords = [[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
const lead = [[76,74,72,74],[72,69,72,74],[76,79,76,74],[74,71,74,72]];
const hz = m => 440 * 2 ** ((m - 69) / 12);
function note(m, t, d, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = type; o.frequency.value = hz(m); f.type = "lowpass"; f.frequency.value = 2400;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0008, t + d);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
function kick(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .18);
  g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
}
function hat(t) {
  const len = ac.sampleRate * .05, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = "highpass"; f.frequency.value = 7000; g.gain.value = .12;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function schedule() {
  while (nextBar < ac.currentTime + .6) {
    const c = chords[bar % 4], l = lead[bar % 4], withLead = Math.floor(bar / 4) % 2 === 1;
    for (let b = 0; b < 4; b++) {
      const t = nextBar + b * beat;
      kick(t); hat(t + beat / 2);
      note(c[0] - 12, t, beat * .9, "triangle", .22);
      for (let k = 0; k < 2; k++) note(c[(b * 2 + k) % 3] + 12, t + k * beat / 2, beat * .45, "square", .035);
      if (withLead) note(l[b], t, beat * .85, "sawtooth", .045);
    }
    nextBar += 4 * beat; bar++;
  }
}
const icoOn = '<svg viewBox="0 0 24 24" fill="#3ef0ff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a8.5 8.5 0 0 1 0 13" stroke="#3ef0ff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const icoOff = '<svg viewBox="0 0 24 24" fill="#b9b4e0"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6" stroke="#b9b4e0" stroke-width="2" stroke-linecap="round"/></svg>';
function setIcon() { $("snd").innerHTML = playing ? icoOn : icoOff; $("snd").setAttribute("aria-label", playing ? "השתקת מוזיקה" : "הפעלת מוזיקה"); $("snd").setAttribute("aria-pressed", String(!playing)); }
function startMusic() {
  try {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); }
    ac.resume(); nextBar = ac.currentTime + .1; bar = 0;
    clearInterval(loopT); loopT = setInterval(schedule, 150); schedule(); playing = true;
  } catch (e) { playing = false; }
  setIcon();
}
function stopMusic() { clearInterval(loopT); if (ac) ac.suspend(); playing = false; setIcon(); }
setIcon();
$("snd").addEventListener("click", () => playing ? stopMusic() : (ac ? (ac.resume(), clearInterval(loopT), nextBar = ac.currentTime + .1, loopT = setInterval(schedule, 150), playing = true, setIcon()) : startMusic()));
$("enterBtn").addEventListener("click", () => { $("gate").classList.add("gone"); startMusic(); lightMenorah(); });

// ===== form =====
let friends = 0;
$("plus").onclick = () => { friends = Math.min(10, friends + 1); $("friends").textContent = friends; };
$("minus").onclick = () => { friends = Math.max(0, friends - 1); $("friends").textContent = friends; };
const okPhone = v => /^0?5\d{8}$/.test(v.replace(/[\s-]/g, ""));
function check(id, ok) { $("f-" + id).classList.toggle("bad", !ok); return ok; }
try { const d = JSON.parse(localStorage.getItem("teenreg") || "{}"); for (const k of ["name","phone","age","parent","note"]) if (d[k]) $(k).value = d[k]; } catch (e) {}
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = k => $(k).value.trim();
  const ok = [check("name", v("name").length > 1), check("phone", okPhone(v("phone"))), check("age", !!v("age")), check("parent", !v("parent") || okPhone(v("parent")))].every(Boolean);
  if (!ok) { document.querySelector(".f.bad input, .f.bad select")?.focus(); return; }
  try { localStorage.setItem("teenreg", JSON.stringify({name: v("name"), phone: v("phone"), age: v("age"), parent: v("parent"), note: v("note")})); } catch (e) {}
  const btn = document.querySelector(".go"); btn.disabled = true; btn.textContent = "שולח…";
  const data = {name: v("name"), phone: v("phone"), age: v("age"), parent: v("parent"), friends, note: v("note")};
  fetch(EV.sheetUrl, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(data)})
    .then(r => r.json()).then(r => { if (!r.ok) throw 0;
      $("sum").textContent = [`שם: ${data.name}`, `טלפון: ${data.phone}`, `גיל: ${data.age}`, friends ? `מביא/ה עוד ${friends} חברים` : ""].filter(Boolean).join("\n");
      $("form").style.display = "none"; $("done").classList.add("show"); $("reg").scrollIntoView({block: "start"});
      P.forEach(s => s.v *= 3); setTimeout(() => P.forEach(s => s.v /= 3), 2500);
      try { localStorage.removeItem("teenreg"); } catch (e) {}
    }).catch(() => { $("err").textContent = `משהו השתבש בשליחה. נסו שוב, או כתבו ל${EV.contactName} ${EV.contactPhone}`; })
    .finally(() => { btn.disabled = false; btn.textContent = "אני בפנים!"; });
});
$("edit").onclick = () => { $("form").reset(); friends = 0; $("friends").textContent = 0; $("err").textContent = ""; $("done").classList.remove("show"); $("form").style.display = ""; };
}
</script>
