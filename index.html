<style>
/* VOICE: teen Chanukah night, loud neon but tidy
   IDEA: the event poster come alive — glowing outlined letters, sticker callouts, neon frames
   PICTURE: vertical neon "חנוכה" over a faint menorah, flanked by speaker card and callouts
   COLOUR and TYPE: electric blue night, cyan neon, magenta edge light; Rubik 900 + Rubik
   LAYOUT: poster hero (3 columns) → date/place → register card → footer */
:root{color-scheme:dark;--bg:#04083a;--ink:#fff;--mute:#b8c6ff;--cyan:#3ff3ff;--cyan2:#18c9ff;--mag:#ff3fd8;--line:rgba(120,220,255,.35)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:17px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
 background:
  radial-gradient(60% 38% at 62% 0%,rgba(80,240,255,.55),transparent 70%),
  radial-gradient(40% 30% at 0% 22%,rgba(255,40,80,.35),transparent 70%),
  radial-gradient(70% 40% at 100% 70%,rgba(40,90,255,.45),transparent 70%),
  linear-gradient(180deg,#0a2bd6 0%,#0718a0 22%,#050f6a 50%,#030843 75%,#02052a 100%)}
html{background:#02052a}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:10px}
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* gate */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;
 background:radial-gradient(60% 45% at 50% 40%,#1238e6,#030a4a 75%);transition:opacity .7s,visibility .7s}
#gate.gone{opacity:0;visibility:hidden}
#gate .big{font-weight:900;font-size:clamp(64px,20vw,120px);line-height:1;color:#0b2fc9;paint-order:stroke fill;-webkit-text-stroke:6px #e9fdff;
 text-shadow:0 0 8px var(--cyan),0 0 22px var(--cyan),0 0 46px var(--cyan2)}
#gate p{color:#d6e4ff;margin:.8em 0 1.6em;font-size:18px}
.btn{border:0;cursor:pointer;min-height:56px;padding:14px 40px;border-radius:6px;font-weight:700;font-size:22px;color:#06204a;
 background:linear-gradient(180deg,#f2feff,#9ff6ff);box-shadow:0 0 0 3px #6ff4ff,0 0 26px rgba(63,243,255,.8);text-decoration:none;display:inline-block}
.btn:active{transform:scale(.97)}

#snd{position:fixed;bottom:14px;left:14px;z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(4,8,58,.6);backdrop-filter:blur(6px);cursor:pointer;display:grid;place-items:center}
#snd svg{width:22px;height:22px}
#snd.off{width:auto;padding:0 16px;gap:8px;display:flex;align-items:center;border-radius:999px;background:linear-gradient(180deg,#f2feff,#9ff6ff);color:#06204a;font-weight:700;font-size:15px;box-shadow:0 0 0 2px #6ff4ff,0 0 18px rgba(63,243,255,.7);animation:pulse 1.6s ease-in-out infinite}
#snd.off svg path{fill:#06204a;stroke:#06204a}

@media(prefers-reduced-motion:reduce){#snd.off{animation:none}}
.bsd{position:absolute;top:16px;right:20px;z-index:3;font-size:15px}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 14px 40px}
.flyerWrap{margin:0 -14px;padding-top:0}
.flyer{display:block;width:100%;height:auto;box-shadow:0 10px 40px rgba(0,0,0,.45)}
@media(min-width:600px){.flyerWrap{margin:24px 0 0}.flyer{border-radius:14px;border:3px solid var(--cyan);box-shadow:0 0 24px rgba(63,243,255,.5)}}

/* poster hero */
.poster{position:relative;padding:54px 0 10px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.meno{position:absolute;inset:18% -6% auto;width:112%;opacity:.38;pointer-events:none;filter:drop-shadow(0 0 6px #6aa8ff)}
.word{grid-column:2;grid-row:1;margin:0;paint-order:stroke fill;display:flex;flex-direction:column;align-items:center;font-weight:900;line-height:.98;
 font-size:clamp(78px,25vw,138px);color:#0a1f8f;-webkit-text-stroke:7px #eafcff;
 text-shadow:0 0 6px #7ff6ff,0 0 16px var(--cyan),0 0 34px var(--cyan2),0 0 60px rgba(24,201,255,.7)}
.word span:first-child{-webkit-text-stroke-color:#ffe6fb;text-shadow:0 0 6px #ff9cf0,0 0 18px var(--mag),0 0 40px rgba(255,63,216,.6)}
.word span{animation:hum 4s ease-in-out infinite}
.word span:nth-child(3){animation-delay:1.3s}
@keyframes hum{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.55}50%{opacity:1}}
.side{display:flex;flex-direction:column;gap:22px;position:relative;z-index:2}
.left{grid-column:3;grid-row:1;align-items:flex-start}
.right{grid-column:1;grid-row:1;align-items:flex-end}

.sticker{font-weight:900;line-height:1.02;color:#fff;text-align:center;font-size:clamp(15px,4.4vw,26px);
 paint-order:stroke fill;-webkit-text-stroke:5px #000;text-shadow:0 3px 0 #000}
.bubble{position:relative;padding:12px 10px 14px;border:3px solid var(--cyan);box-shadow:0 0 12px var(--cyan),inset 0 0 10px rgba(63,243,255,.4)}
.bubble::after{content:"";position:absolute;bottom:-16px;inset-inline-start:18px;border:9px solid transparent;border-top-color:var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}
.org{font-weight:900;color:var(--cyan);font-size:clamp(18px,5.6vw,30px);line-height:1.02;text-align:center;text-shadow:0 0 14px rgba(63,243,255,.6)}
.arrows{color:#fff;font-weight:900;letter-spacing:-6px;font-size:30px;text-shadow:0 0 10px var(--mag),0 0 18px var(--mag);direction:ltr}
.speaker{width:100%}

.speaker .ph::after{content:"✦";position:absolute;left:-2px;bottom:-8px;font-size:34px;color:#fff;text-shadow:0 0 10px #c6a8ff,0 0 20px var(--mag)}
.speaker b{display:block;font-weight:900;font-size:clamp(17px,4.8vw,24px);margin-top:10px;line-height:1.1}
.speaker span{display:block;font-size:clamp(15px,4.2vw,20px);line-height:1.15}

/* when / where */

.count span{font-size:12px;color:var(--mute)}
.cdl{color:var(--mute);font-size:14px;margin-top:6px;text-align:end}
.logos{display:flex;gap:12px;align-items:center;justify-content:center}

.ctaRow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;gap:12px}

/* form */
.card{position:relative;z-index:2;margin-top:40px;padding:24px 18px;background:rgba(3,10,70,.72);border:3px solid var(--cyan);box-shadow:0 0 20px rgba(63,243,255,.55),inset 0 0 18px rgba(63,243,255,.18);backdrop-filter:blur(8px)}
.card h2{margin:0;font-weight:900;font-size:clamp(30px,8vw,40px);line-height:1.05;color:#06125a;paint-order:stroke fill;-webkit-text-stroke:4px #eafcff;text-shadow:0 0 8px var(--cyan),0 0 22px var(--cyan2)}
.card>form>p,.card>div>p{color:#d6e4ff;margin:.5em 0 1.2em}
.f{margin-bottom:16px}
.f label{display:block;font-weight:500;margin-bottom:6px}
.f label small{color:var(--mute);font-weight:400}
.f input,.f select,.f textarea{width:100%;min-height:52px;padding:12px 14px;font-size:16px;border-radius:4px;border:2px solid rgba(120,220,255,.35);background:rgba(0,4,40,.55);outline:none;transition:border-color .2s,box-shadow .2s}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(63,243,255,.45)}
.f .err{display:none;color:#ffb0d8;font-size:14px;margin-top:5px}
.f.bad input,.f.bad select{border-color:#ff5fb7}.f.bad .err{display:block}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:48px;height:48px;border-radius:4px;border:2px solid var(--line);background:rgba(255,255,255,.06);font-size:24px;cursor:pointer}
.step output{min-width:2ch;text-align:center;font-weight:900;font-size:24px;color:var(--cyan)}
.go{width:100%}
#done{display:none;text-align:center}
#done.show{display:block;animation:pop .5s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.sum{text-align:start;margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:15px;white-space:pre-line}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 10px}
footer{position:relative;z-index:1;text-align:center;color:var(--mute);font-size:14px;padding:6px 18px 36px}
footer a{color:var(--cyan)}

/* phone layout: title across the top, then speaker card, then two callouts */
@media(max-width:600px){
 .poster{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"word word" "org org" "spk spk" "b1 b2";gap:18px;padding-top:58px}
 .side{display:contents}
 .arrows{display:none}
 .word{grid-area:word;flex-direction:row;justify-content:center;font-size:clamp(60px,19vw,92px);-webkit-text-stroke-width:6px}
 .org{grid-area:org;font-size:24px}
 .org br{display:none}
 .org{white-space:normal}
 .speaker{grid-area:spk;display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 16px;align-items:center;padding:12px;border:2px solid var(--line);background:rgba(0,8,60,.45)}
 .speaker .ph{grid-row:1/4;max-width:none}
 .speaker{grid-template-rows:repeat(3,min-content);align-content:center}
 .speaker b,.speaker span{grid-column:2;align-self:end}
 .speaker span:last-child{align-self:start}
 .speaker b{margin:0;font-size:24px}
 .speaker span{font-size:19px}
 .right>.bubble{grid-area:b1;align-self:center;font-size:19px}
 .food{grid-area:b2;grid-template-columns:auto;justify-items:center}
 .food svg{width:84px}
 .food .bubble{font-size:19px}
 .meno{inset:8% 0 auto;width:100%;opacity:.25}
 .info{margin-top:28px}
 .count{justify-content:center}
 .cdl{text-align:center}
 .ctaRow{flex-direction:column-reverse;align-items:stretch}
 .ctaRow .btn{text-align:center}
 .logo{align-self:center;width:64px}
}
@media(max-width:380px){.word{-webkit-text-stroke-width:5px}.sticker{-webkit-text-stroke-width:4px}}
@media(prefers-reduced-motion:reduce){.word span{animation:none}#done.show{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="sparks" aria-hidden="true"></canvas>

<main>

  </section>
  <section class="info">
    <div class="d" id="when1"></div>
    <hr>

    <div class="ctaRow">
      <span class="logos"><img class="logo hf" src="haifa.jpg" alt="עיריית חיפה – מינהל חינוך, תרבות וספורט"><img class="logo" src="cteen.jpg" alt="חב״ד לנוער חיפה" onerror="this.style.display='none'"></span>

        <div class="f" id="f-age"><label for="age">שכבה</label><select id="age"><option value="">בחירה</option><option>ז׳</option><option>ח׳</option><option>ט׳</option><option>י׳</option></select><div class="err">בחרו שכבה</div></div>

      <div class="f"><label for="school">בית ספר <small>(לא חובה)</small></label><input id="school" autocomplete="off" placeholder="באיזה בית ספר את/ה לומד/ת?"></div>

</main>
<footer id="foot"></footer>

<script>
{
const EV = {
  org: "בחב״ד\nלנוער\nחיפה",
  start: "2026-12-10T20:00:00+02:00",
  when: ["יום חמישי · נר שביעי של חנוכה", "10.12 · בשעה 20:00"],
  place: "״היציע״ – מרכז הנוער נאות פרס\nאצטדיון סמי עופר (ליד קופות האצטדיון)",
  sheetUrl: "https://script.google.com/macros/s/AKfycbx17Ix9ZboOHjG01eIVjI1frgZ8Yg_r0dLn7_uC_uxtdj5A1HKiJIs2azrBl1SPFuyv/exec",
  whatsapp: "972584207543",
  contactName: "הרב שלומי והרב שניאור", contactPhone: "058-4207543",
  ages: [11, 18]
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if ($("org")) $("org").innerHTML = EV.org.split("\n").map(esc).join(" <br>");
$("when1").innerHTML = `${esc(EV.when[0])}<small>${esc(EV.when[1])}</small>`;
$("place").textContent = EV.place;
$("foot").innerHTML = `שאלות? ${esc(EV.contactName)} · <a href="https://wa.me/${esc(EV.whatsapp)}" target="_blank" rel="noopener" dir="ltr">${esc(EV.contactPhone)}</a>`;
const ageSel = $("age");

// faint menorah behind the title
function lightMenorah() {}
// ===== countdown =====
const target = new Date(EV.start).getTime();
function tick() {
  let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
  if (s === 0) { $("count").innerHTML = ""; $("cdl").textContent = Date.now() > target + 4 * 3600e3 ? "האירוע הסתיים — תודה שהייתם איתנו!" : "המסיבה כבר התחילה!"; return; }
  const parts = [[Math.floor(s / 86400), "ימים"], [Math.floor(s % 86400 / 3600), "שעות"], [Math.floor(s % 3600 / 60), "דקות"], [s % 60, "שניות"]];
  $("count").innerHTML = parts.map(([n, l]) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l}</span></div>`).join("");
  $("cdl").textContent = "עד שמדליקים";
}
tick(); setInterval(tick, 1000);

// ===== sparks =====
const cv = $("sparks"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, P = [];
function size() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
for (let i = 0; i < 46; i++) P.push({x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + .4, v: Math.random() * .0012 + .0004, c: Math.random() < .7 ? "63,243,255" : "255,63,216", p: Math.random() * 6});
function draw(t) {
  cx.clearRect(0, 0, W, H);
  for (const s of P) {
    if (!reduce) { s.y -= s.v; if (s.y < -.02) { s.y = 1.02; s.x = Math.random(); } }
    const a = .35 + .35 * Math.sin(t / 600 + s.p);
    cx.beginPath(); cx.arc(s.x * W, s.y * H, s.r * devicePixelRatio, 0, 7);
    cx.fillStyle = `rgba(${s.c},${a})`; cx.shadowBlur = 8 * devicePixelRatio; cx.shadowColor = `rgba(${s.c},.9)`; cx.fill();
  }
  if (!reduce) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ===== music (original synth loop, Web Audio) =====
let ac = null, master = null, playing = false, loopT = null, nextBar = 0, bar = 0;
const BPM = 112, beat = 60 / BPM;
const chords = [[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
const lead = [[76,74,72,74],[72,69,72,74],[76,79,76,74],[74,71,74,72]];
const hz = m => 440 * 2 ** ((m - 69) / 12);
function note(m, t, d, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = type; o.frequency.value = hz(m); f.type = "lowpass"; f.frequency.value = 2400;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0008, t + d);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
function kick(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .18);
  g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
}
function hat(t) {
  const len = ac.sampleRate * .05, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = "highpass"; f.frequency.value = 7000; g.gain.value = .12;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function schedule() {
  while (nextBar < ac.currentTime + .6) {
    const c = chords[bar % 4], l = lead[bar % 4], withLead = Math.floor(bar / 4) % 2 === 1;
    for (let b = 0; b < 4; b++) {
      const t = nextBar + b * beat;
      kick(t); hat(t + beat / 2);
      note(c[0] - 12, t, beat * .9, "triangle", .22);
      for (let k = 0; k < 2; k++) note(c[(b * 2 + k) % 3] + 12, t + k * beat / 2, beat * .45, "square", .035);
      if (withLead) note(l[b], t, beat * .85, "sawtooth", .045);
    }
    nextBar += 4 * beat; bar++;
  }
}
const icoOn = '<svg viewBox="0 0 24 24" fill="#3ef0ff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a8.5 8.5 0 0 1 0 13" stroke="#3ef0ff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const icoOff = '<svg viewBox="0 0 24 24" fill="#b9b4e0"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6" stroke="#b9b4e0" stroke-width="2" stroke-linecap="round"/></svg>';
function setIcon() { $("snd").classList.toggle("off", !playing); $("snd").innerHTML = playing ? icoOn : icoOff + "<span>הפעלת מוזיקה</span>"; $("snd").setAttribute("aria-label", playing ? "השתקת מוזיקה" : "הפעלת מוזיקה"); $("snd").setAttribute("aria-pressed", String(!playing)); }
function startMusic() {
  try {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); }
    ac.resume(); nextBar = ac.currentTime + .1; bar = 0;
    clearInterval(loopT); loopT = setInterval(schedule, 150); schedule(); playing = true;
  } catch (e) { playing = false; }
  setIcon();
}
function stopMusic() { clearInterval(loopT); if (ac) ac.suspend(); playing = false; setIcon(); }
setIcon();
$("snd").addEventListener("click", () => playing ? (userMuted = true, stopMusic()) : (ac ? (ac.resume(), clearInterval(loopT), nextBar = ac.currentTime + .1, loopT = setInterval(schedule, 150), playing = true, setIcon()) : startMusic()));
// browsers only allow sound after a tap: start music on the first touch anywhere (not on the sound button itself)
let userMuted = false;
// phones only allow sound after a real tap (touchend/click, not touchstart)
const ACT = ["click","touchend","pointerup","keydown"];
const firstTap = e => { if (e.target.closest && e.target.closest("#snd")) return; ACT.forEach(t => removeEventListener(t, firstTap, true)); if (!playing && !userMuted) startMusic(); };
ACT.forEach(t => addEventListener(t, firstTap, true));

// ===== form =====
const okPhone = v => /^0?5\d{8}$/.test(v.replace(/[\s-]/g, ""));
function check(id, ok) { $("f-" + id).classList.toggle("bad", !ok); return ok; }
try { const d = JSON.parse(localStorage.getItem("teenreg") || "{}"); for (const k of ["name","last","phone","age","parent","school","note"]) if (d[k]) $(k).value = d[k]; } catch (e) {}
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = k => $(k).value.trim();
  const ok = [check("name", v("name").length > 0), check("last", v("last").length > 0), check("phone", okPhone(v("phone"))), check("age", !!v("age")), check("parent", !v("parent") || okPhone(v("parent")))].every(Boolean);
  if (!ok) { document.querySelector(".f.bad input, .f.bad select")?.focus(); return; }
  try { localStorage.setItem("teenreg", JSON.stringify({name: v("name"), last: v("last"), school: v("school"), phone: v("phone"), age: v("age"), parent: v("parent"), note: v("note")})); } catch (e) {}
  const btn = document.querySelector(".go"); btn.disabled = true; btn.textContent = "שולח…";
  const data = {name: v("name"), last: v("last"), phone: v("phone"), age: v("age"), parent: v("parent"), school: v("school"), note: v("note")};
  fetch(EV.sheetUrl, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(data)})
    .then(r => r.json()).then(r => { if (!r.ok) throw 0;
      $("sum").textContent = [`שם: ${data.name} ${data.last}`, `טלפון: ${data.phone}`, `שכבה: ${data.age}`, data.school ? `בית ספר: ${data.school}` : ""].filter(Boolean).join("\n");
      $("form").style.display = "none"; $("done").classList.add("show"); $("reg").scrollIntoView({block: "start"});
      P.forEach(s => s.v *= 3); setTimeout(() => P.forEach(s => s.v /= 3), 2500);
      try { localStorage.removeItem("teenreg"); } catch (e) {}
    }).catch(() => { $("err").textContent = `משהו השתבש בשליחה. נסו שוב, או כתבו ל${EV.contactName} ${EV.contactPhone}`; })
    .finally(() => { btn.disabled = false; btn.textContent = "אני בפנים!"; });
});
$("edit").onclick = () => { $("form").reset(); $("err").textContent = ""; $("done").classList.remove("show"); $("form").style.display = ""; };
}
